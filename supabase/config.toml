# ============================================================================
# Supabase CLI configuration — RHS Music & Arts Attendance
# ============================================================================
# OPTIONAL, and it changes nothing about the deployed app: Vercel builds the
# frontend from src/, and nothing in it reads this file at runtime.
#
# It is a RECORD of the intended auth configuration — templates, redirect
# URLs, SMTP — not a push source. **Do not run `supabase config push` against
# this project.** `supabase config diff` on 2026-10-18 showed 19 settings that
# exist only remotely (Google sign-in, TOTP MFA, the security-notification
# toggles, a 1000/hour email rate limit, and more). A push would replace all of
# them with this file's defaults — Google sign-in off, email limit down to
# 2/hour. Apply changes in the dashboard or through the Management API, then
# keep this file in step by hand.
#
# Operator guide (which email fires when, SMTP, redirect URLs, how to test):
# docs/EMAIL_SETUP.md. Dashboard equivalent of this file:
# Authentication → Emails → Templates / SMTP Settings.
# ============================================================================

[auth]
# The production origin. Everything that does not name its own redirect falls
# back to this, so it must be the deployed app — not localhost.
site_url = "https://rhsattendance.org/"

# Every destination an email link is allowed to land on. A link whose redirect
# is missing here is silently rewritten to the Site URL, which is how a
# password-reset email ends up opening the home page instead of the reset form.
additional_redirect_urls = [
  # Confirmation and invite links: src/hooks/useAuth.tsx passes
  # `${window.location.origin}/` as emailRedirectTo.
  "https://rhsattendance.org/",
  "https://rhsattendance.org/**",
  # The password-recovery link: resetPasswordForEmail passes
  # `${window.location.origin}/reset-password`, and the app refuses to apply a
  # recovery without that screen (AuthScreen mode="reset").
  "https://rhsattendance.org/reset-password",
  # The Vercel deployment still answers on its own hostname; keep its links
  # working, including previews, while the custom domain settles in.
  "https://redmond-music-arts-program-mandalora.vercel.app/",
  "https://redmond-music-arts-program-mandalora.vercel.app/**",
  "https://redmond-*-music-arts-program-mandalora.vercel.app",
  "https://redmond-*-music-arts-program-mandalora.vercel.app/**",
  "https://redmond-music-arts-program-mandalora.vercel.app/reset-password",
  # Local development — both call sites above, on the Vite dev server.
  "http://localhost:5173/**",
]

[auth.email]
# Anyone may create an account; the roster is what limits what they can see.
enable_signup = true
# Confirmation is ON in this project, so a new account cannot sign in until the
# link in confirmation.html is used. The app's sign-up screen says so and offers
# a resend.
enable_confirmations = true

[functions.delete-account]
verify_jwt = true

[functions.invite-student]
verify_jwt = true

[functions.import-google-calendar]
verify_jwt = true

# Scheduled, server-to-server only: Supabase Cron (pg_cron + pg_net) calls it
# with no Authorization header at all, so JWT verification has to be off. The
# function is not open as a result — it refuses every caller unless they present
# the `x-event-digest-secret` header (EVENT_DIGEST_SECRET) or a service-role
# bearer, so nothing that can reach the URL can trigger a mail run.
[functions.event-digest]
verify_jwt = false

# Scheduled, server-to-server only, exactly like the digest. Supabase Cron calls
# it with no Authorization header; the function refuses every caller unless it
# presents the `x-event-reminder-secret` header (EVENT_REMINDER_SECRET) or the
# exact service-role bearer. No browser can trigger a reminder run.
[functions.event-reminders]
verify_jwt = false

# Scheduled, server-to-server only. Called by Supabase Cron with the
# `x-event-announcement-secret` header (EVENT_ANNOUNCEMENT_SECRET). It mails
# students when an event is added, so no browser may trigger a run.
[functions.event-announcements]
verify_jwt = false

# Scheduled, server-to-server only. Called by Supabase Cron with the
# `x-absence-request-email-secret` header (ABSENCE_REQUEST_EMAIL_SECRET). It
# mails a program's reviewers when a student asks to be excused, so no browser
# may trigger a run.
[functions.absence-request-emails]
verify_jwt = false

# Browser-invoked by staff (the make-up composer). The platform verifies the
# JWT, and the function verifies the account and its program staff role again
# before reading attendance or calling Resend. Default is true; kept explicit so
# neither flag can be flipped by accident.
[functions.send-makeup-emails]
verify_jwt = true

# ----------------------------------------------------------------------------
# Authentication emails. Subject lines are what the inbox shows; each template
# heading matches it. Add a brand suffix ("· RHS Music & Arts") for recognition.
# ----------------------------------------------------------------------------

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've been invited"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} is your verification code"
content_path = "./supabase/templates/reauthentication.html"

# Security notifications are separate from authentication emails. Supabase
# sends them only when the corresponding notification is enabled.
[auth.email.notification.password_changed]
enabled = true
subject = "Your password was changed"
content_path = "./templates/password_changed_notification.html"

# Sent after the address actually changes (not the "confirm your new email"
# request above). `.OldEmail` and `.Email` (the new one) are the documented
# variables for this notification.
[auth.email.notification.email_changed]
enabled = true
subject = "Your email address was changed"
content_path = "./templates/email_changed_notification.html"

# ----------------------------------------------------------------------------
# Auth email transport.
#
# Auth mail goes through Resend's SMTP relay from the domain rhsattendance.org
# (verified in Resend). The password is the Resend API key and is never written
# here. The live project was set through the Management API on 2026-10-18;
# apply future changes the same way or in Authentication → Emails → SMTP
# Settings. Never push this file wholesale (see the warning at the top of the
# file, and docs/EMAIL_SETUP.md §3).
#
# The event-digest function uses a Resend API key too, but as an API credential
# for api.resend.com, not as SMTP. Give it its own key so either can be revoked
# without breaking the other — see docs/EMAIL_SETUP.md §6a.
# ----------------------------------------------------------------------------

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
# 587 uses STARTTLS and is what the live project runs; 465 (implicit TLS) works
# too — Resend's own Supabase guide uses it.
port = 587
# Resend's SMTP username is the literal string "resend", not an address.
user = "resend"
pass = "env(RESEND_API_KEY)"
# Must be on the domain verified in Resend or the relay refuses the message.
admin_email = "noreply@rhsattendance.org"
sender_name = "RHS Music & Arts"
